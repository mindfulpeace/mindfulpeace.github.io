# 网站基本设置
title: 静心学堂
description: 探索生命真谛，建立智慧人生
url: https://mindfulpeace.github.io
baseurl: ""
markdown: kramdown

# 语言设置
language: zh-CN

# SEO 和 Open Graph 设置
author: 静心学堂
twitter:
  username: mindfulpeace
  card: summary

# Open Graph 设置
og:
  title: 静心学堂 - 探索生命真谛，建立智慧人生
  type: website
  image: /assets/nav-logo.png
  description: 为静心学堂学员提供课程"纯"文本查询服务
  url: https://mindfulpeace.github.io

# Twitter Card 设置
twitter:
  username: mindfulpeace
  card: summary

# GitHub Pages 设置
github: [metadata]

# 排除软链接目录（中文名注释，避免生成重复 URL）
exclude:
  - _site
  - Gemfile.lock
  - _以往课程
  - ".vscode"
  - "pdf"
  - "g[1-3]_*"
  - "g2/s[1-4]_*"
  - "g1/u[0-9]_*"
  - "g1/u0/[0-9]*_*"
  - "g1/u1/[0-9]*_*"
  - "g1/u2/[0-9]*_*"
  - "g1/u2/xfzdrstd_*"
  - "g1/u3/[0-9]*_*"
  - "g1/u4/[0-9]*_*"
  - "g1/u5/[0-9]*_*"
  - "g1/u5/zjft_*"
  - "g1/u6/[0-9]*_*"
  - "g1/u6/gyxxsc_*"
  - "g1/xfzdrstd_*"
  - "g2/s1/0[1-6]_*"
  - "g2/s1/dcd_*"
  - "g2/s1/szyds_*"
  - "g2/s1/dcd/u[0-9][0-9]_*"
  - "g2/s2/0[1-3]_*"
  - "g2/s2/bxdzp_*"
  - "g2/s2/bxdzp/[0-9][0-9]_*"
  - "g2/s2/bf_*"
  - "g2/s2/bf/explain_*"
  - "g2/s3/rxl_*"

# 插件
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag