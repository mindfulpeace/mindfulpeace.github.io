<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/nav-logo.png" type="image/png" />
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:title" content="{{ page.title | default: site.title }}" />
    <meta property="og:description" content="{{ page.description | default: site.description }}" />
    <meta property="og:image" content="{{ site.url }}{{ site.og.image | default: '/assets/nav-logo.png' }}" />
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ page.title | default: site.title }}" />
    <meta name="twitter:description" content="{{ page.description | default: site.description }}" />
    <meta name="twitter:image" content="{{ site.url }}{{ site.og.image | default: '/assets/nav-logo.png' }}" />
    <title>{{ page.title | escape }} - {{ site.title | escape }}</title>
    <link rel="stylesheet" href="/assets/style.css?v=5" />
  </head>
  <body>
    <nav>
      <ul id="breadcrumb">
        <li><a href="/">首页</a></li>
      </ul>
    </nav>
    <main>
      {{ content }}
    </main>
    <footer>
      <a href="https://github.com/mindfulpeace/mindfulpeace.github.io/edit/main{{page.dir}}{{page.name}}">协助编辑</a>
      <span><a href="#" id="backToTop">返回顶部</a></span>
    </footer>
    <script src="/assets/script.js"></script>
  </body>
</html>
